name: Build and deploy

on:
  push:
    branches: [main]
  # Pushes made by the auto-merge workflow do not trigger "push" workflows,
  # so also run when it has finished.
  workflow_run:
    workflows: ['Auto-merge agent branches to main']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  EMSDK_VERSION: 7.0.0

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Cache engine builds
        uses: actions/cache@v4
        with:
          path: |
            build/engines/*.stamp
            public/cores
            public/licenses
          key: engines-${{ hashFiles('scripts/build-engines.sh', '.gitmodules') }}-${{ github.sha }}
          restore-keys: engines-${{ hashFiles('scripts/build-engines.sh', '.gitmodules') }}-

      - name: Build engines
        run: |
          ~/emsdk/emsdk activate "$EMSDK_VERSION" > /dev/null
          source ~/emsdk/emsdk_env.sh > /dev/null
          npm run build:engines

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Browser smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
